[package]
name = "ore-bench"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Benchmarks for the ORE format study in formats/, run by hand"
license = "GPL-3.0-or-later"
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0"
cd = { path = "../../crates/cd" }
cdc-chunkers = { version = "0.1", default-features = false }
chd-rs = { path = "../../crates/chd-rs", default-features = false }
fastcdc = "5"
gcwii = { path = "../../crates/gcwii" }
lzma-rust2 = { workspace = true, features = ["encoder"] }
mothcdc = { version = "0.7", default-features = false }
quickcdc = { version = "1", default-features = false }
rayon.workspace = true
rvz-rs = { path = "../../crates/rvz-rs", default-features = false }
sha1.workspace = true
zstd = { workspace = true, features = ["zstdmt"] }

[dev-dependencies]
aes = "0.9"
tempfile.workspace = true
