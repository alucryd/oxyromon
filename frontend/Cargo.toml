[package]
name = "oxyromon-frontend"
version = "0.22.0"
edition = "2024"
publish = false

# Standalone crate: do not let cargo walk up and treat the parent oxyromon
# package as a workspace root (keeps WASM deps out of the native build).
[workspace]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.7", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CustomElementRegistry",
    "Event",
    "EventSource",
    "MessageEvent",
    "File",
    "FileList",
    "FormData",
    "DataTransfer",
    "DragEvent",
    "HtmlInputElement",
    "HtmlDocument",
    "MediaQueryList",
    "Navigator",
    "MediaQueryListEvent",
    "Storage",
    "Window",
] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
