<!doctype html>
<html lang="en">

    <meta charset="utf-8" />
    <meta name="description" content="" />
    <link rel="icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>oxyromon</title>
    <link data-trunk rel="copy-dir" href="vendor/webawesome" />
    <link data-trunk rel="copy-dir" href="vendor/icons" data-target-path="icons" />
    <link rel="stylesheet" href="/webawesome/styles/webawesome.css" />
    <script type="module">
      // Serve icons from our own copy: the default resolver points at the Font
      // Awesome CDN, which is not reachable when oxyromon is run offline.
      import { setBasePath, setIconPath } from "/webawesome/webawesome.js";
      setBasePath("/webawesome");
      setIconPath("/icons");
    </script>
    <script type="module" src="/webawesome/webawesome.loader.js"></script>
    <link data-trunk rel="css" href="tailwind.css" />
    <link data-trunk rel="copy-file" href="icon.svg" />
    <link data-trunk rel="copy-file" href="logo.svg" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
  </head>

  <body></body>
</html>
