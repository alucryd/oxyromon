[package]
name = "xso-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "CSO/ZSO (compressed PSP/PS2 ISO) compression and decompression, interchangeable with maxcso"
license = "ISC"
repository.workspace = true
keywords = ["cso", "zso", "psp", "iso", "compression"]
categories = ["compression", "command-line-utilities"]
include = ["src/**/*", "tests/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[lib]
name = "xso_rs"
path = "src/lib.rs"

[[bin]]
name = "xsors"
path = "src/bin/xsors/main.rs"
required-features = ["cli"]

[dependencies]
# Raw deflate with all four zlib strategies, matching maxcso's zlib trials byte for byte.
libz-sys = "1.1"
# LZ4_compress_HC for ZSO.
lz4-sys = "1.11"
rayon.workspace = true
thiserror.workspace = true
clap = { workspace = true, optional = true }
console = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["cli"]
cli = ["dep:clap", "dep:console", "dep:indicatif"]
