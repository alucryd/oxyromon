[package]
name = "test-support"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Synthetic discs and titles for the format crates' tests: GameCube and Wii discs under one feature, Wii U discs and NUS titles under another, PlayStation 3 discs and their IRDs under a third"
# The gcwii family ports Dolphin's junk generator and Wii hashing, GPL-2.0
# or later; the wiiu family is that crate's disc model, GPL-3.0 or later
license = "GPL-2.0-or-later AND GPL-3.0-or-later"
repository.workspace = true
# Never published: a dev-dependency of the crates whose tests build their
# discs here, path-only, which publishing drops
publish = false

[dependencies]
aes = "0.9"
crc32fast = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }

[features]
# The synthetic GameCube and Wii discs, as rvz-rs, wbfs-rs and ore-rs are
# tested on them
gcwii = ["dep:sha1"]
# The synthetic Wii U disc and its NUS update, as wux-rs, ore-rs and
# smelt-rs are tested on them
wiiu = ["dep:sha1"]
# The synthetic PlayStation 3 disc and its IRD, as ps3-rs and oxyromon are
# tested on them
ps3 = ["dep:crc32fast", "dep:flate2", "dep:md-5"]
