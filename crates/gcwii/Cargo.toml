[package]
name = "gcwii"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "GameCube and Wii disc specifics shared by rvz-rs and wbfs-rs"
# Mixed, each file's in an SPDX header: what it ports from Dolphin GPL-2.0
# or later (LICENSE), what ore-rs's reader needs of it MIT OR Apache-2.0
license = "GPL-2.0-or-later AND (MIT OR Apache-2.0)"
repository.workspace = true
# Never published: each crate using it embeds a copy of its source, so that
# each publishes standalone
publish = false

[lib]
name = "gcwii"
path = "src/lib.rs"

[dependencies]
aes = "0.9"
rayon.workspace = true
sha1.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
