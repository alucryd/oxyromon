[package]
name = "ore-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "ORE, oxyROMon's ROM enclosure: GameCube and Wii discs deduped in content-defined chunks and compressed in groups, bit-exact"
license = "GPL-3.0-or-later"
repository.workspace = true
keywords = ["ore", "gamecube", "wii", "compression", "deduplication"]
categories = ["compression", "command-line-utilities"]
include = ["src/**/*", "tests/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[lib]
name = "ore_rs"
path = "src/lib.rs"

[[bin]]
name = "orers"
path = "src/bin/orers/main.rs"
required-features = ["cli"]

[dependencies]
# gcwii's
aes = "0.9"
rayon.workspace = true
sha1.workspace = true
thiserror.workspace = true
# ore-rs's own
blake3 = "1.8"
ciborium = "0.2"
crc32c = "0.6"
crc32fast.workspace = true
lzma-rust2 = { workspace = true, features = ["encoder"] }
md-5.workspace = true
reed-solomon-erasure = { version = "6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
zstd.workspace = true
clap = { workspace = true, optional = true }
console = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

[dev-dependencies]
# To build synthetic discs
aes = "0.9"
# The reference MinCDC the chunker is checked against
mothcdc = { version = "0.7", default-features = false }
sha1.workspace = true
tempfile.workspace = true

[features]
default = ["cli"]
cli = ["dep:clap", "dep:console", "dep:indicatif"]
