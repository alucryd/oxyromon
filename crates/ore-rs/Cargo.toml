[package]
name = "ore-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "ORE, oxyROMon's ROM enclosure: GameCube, Wii, PlayStation 2 and PSP discs, CDs, GD-ROMs and cartridge ROMs deduped in content-defined chunks and compressed in groups, bit-exact"
# Each file says its own in an SPDX header; built without `write`, only
# the MIT OR Apache-2.0 and BSD-3-Clause ones are compiled
license = "GPL-3.0-or-later AND GPL-2.0-or-later AND (MIT OR Apache-2.0) AND BSD-3-Clause AND CC-BY-4.0 AND CC0-1.0"
repository.workspace = true
# Never published: only oxyROMon uses ORE, and smelt, which is not published
# either; its `#[path]`s reach the cd and gcwii crates' sources outside it
publish = false
keywords = ["ore", "gamecube", "wii", "playstation", "compression"]
categories = ["compression", "command-line-utilities"]
include = [
    "src/**/*",
    "tests/**/*",
    "LICENSE",
    "LICENSE-APACHE",
    "LICENSE-BSD-3-Clause",
    "LICENSE-MIT",
    "README.md",
    "CHANGELOG.md",
    "SPEC.md",
    "spec/**/*",
]

[lib]
name = "ore_rs"
path = "src/lib.rs"

[[bin]]
name = "orers"
path = "src/bin/orers/main.rs"
required-features = ["cli"]

[dependencies]
# gcwii's
aes = "0.9"
rayon.workspace = true
sha1.workspace = true
thiserror.workspace = true
# ore-rs's own
blake3 = "1.8"
ciborium = "0.2"
crc32c = "0.6"
crc32fast = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, features = ["encoder"] }
md-5 = { workspace = true, optional = true }
reed-solomon-erasure = { version = "6", default-features = false }
rusty_flac.workspace = true
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
zstd.workspace = true
clap = { workspace = true, optional = true }
console = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

[dev-dependencies]
# To build synthetic discs
aes = "0.9"
# The reference MinCDC the chunker is checked against
mothcdc = { version = "0.7", default-features = false }
sha1.workspace = true
tempfile.workspace = true

[features]
default = ["cli", "write"]
cli = ["write", "dep:clap", "dep:console", "dep:indicatif"]
# Writing OREs and stores, and what is ported from Dolphin for it, under
# GPL-2.0-or-later; without it, ore-rs reads, and is MIT OR Apache-2.0
write = ["dep:crc32fast", "dep:md-5"]
