[package]
name = "cd"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "CD-ROM specifics shared by chd-rs and ore-rs: sectors, EDC and ECC, cue sheets, ISO 9660"
# MAME's ECC, and oxyROMon's own code under the same terms, so that every
# host may embed it: chd-rs is BSD-3-Clause, ore-rs GPL-3.0-or-later
license = "BSD-3-Clause"
repository.workspace = true
# Never published: each crate using it embeds a copy of its source, so that
# each publishes standalone
publish = false

[lib]
name = "cd"
path = "src/lib.rs"
