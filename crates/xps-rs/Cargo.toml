[package]
name = "xps-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "IPS and BPS patch application, as Flips applies them"
license = "GPL-3.0-or-later"
repository.workspace = true
keywords = ["ips", "bps", "flips", "patch", "rom"]
categories = ["command-line-utilities"]
include = ["src/**/*", "tests/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[lib]
name = "xps_rs"
path = "src/lib.rs"

[[bin]]
name = "xpsrs"
path = "src/bin/xpsrs/main.rs"
required-features = ["cli"]

[dependencies]
crc32fast.workspace = true
thiserror.workspace = true
clap = { workspace = true, optional = true }
console = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["cli"]
cli = ["dep:clap", "dep:console", "dep:indicatif"]
