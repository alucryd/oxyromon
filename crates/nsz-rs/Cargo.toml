[package]
name = "nsz-rs"
version = "0.2.0"
edition.workspace = true
description = "Rust port of nsz (NSP <-> NSZ zstd compression)"
license = "MIT"
rust-version.workspace = true
repository.workspace = true
keywords = ["nintendo-switch", "nsz", "nsp", "zstd", "compression"]
categories = ["compression", "command-line-utilities"]
include = ["src/**/*", "tests/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[lib]
name = "nsz_rs"
path = "src/lib.rs"

[[bin]]
name = "nszrs"
path = "src/bin/nszrs/main.rs"
required-features = ["cli"]

[dependencies]
aes = "0.9"
sha2 = "0.11"
crc32fast.workspace = true
hex = "0.4"
rayon.workspace = true
thiserror.workspace = true
# `experimental` exposes frame progression, used for accurate solid progress.
zstd = { version = "0.14", features = ["zstdmt", "experimental"] }
clap = { workspace = true, optional = true }
console = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["cli"]
cli = ["dep:clap", "dep:console", "dep:indicatif"]
