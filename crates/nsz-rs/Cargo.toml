[package]
name = "nsz-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of nsz (NSP <-> NSZ zstd compression)"
license = "MIT"

[lib]
name = "nsz_rs"
path = "src/lib.rs"

[[bin]]
name = "nszrs"
path = "src/bin/nszrs.rs"
required-features = ["cli"]

[dependencies]
aes = "0.8"
sha2 = "0.10"
crc32fast = "1.4"
hex = "0.4"
rayon = "1.10"
thiserror = "2"
zstd = { version = "0.13", features = ["zstdmt"] }
indicatif = { version = "0.18.6", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["cli"]
# The `nszrs` binary. Library users can opt out with `default-features = false`.
cli = ["dep:indicatif"]
