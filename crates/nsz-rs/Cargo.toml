[package]
name = "nsz-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of nsz (NSP <-> NSZ zstd compression)"
license = "MIT"

[lib]
name = "nsz_rs"
path = "src/lib.rs"

[[bin]]
name = "nszrs"
path = "src/bin/nszrs.rs"

[dependencies]
aes = "0.8"
cipher = "0.4"
sha2 = "0.10"
crc32fast = "1.4"
hex = "0.4"
rayon = "1.10"
thiserror = "2"
zstd = { version = "0.13", features = ["zstdmt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
