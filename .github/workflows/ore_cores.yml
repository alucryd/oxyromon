name: ORE cores

# Rebuild the feat/ore branch of each libretro core that reads ORE through
# libsmelt against this commit's libsmelt, run its ORE test where it has
# one, and keep the core as an artifact: on a push that changes libsmelt or
# ore-rs, which it is built on, and by hand.
on:
  push:
    branches: [develop, master]
    paths:
      - "crates/smelt-rs/**"
      - "crates/ore-rs/**"
      - ".github/workflows/ore_cores.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of the cores to build"
        default: feat/ore
      core:
        description: "Core to build"
        type: choice
        default: all
        options: [all, beetle-psx, parallel-ps2, pcee2, dolphin, mesen, mesen-s, sameboy, mgba]

concurrency:
  group: ore-cores-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CORE_REF: ${{ inputs.ref || 'feat/ore' }}
  SMELT_DIR: ${{ github.workspace }}/oxyromon/crates/smelt-rs

# Each job checks oxyromon out in oxyromon/ and the core in core/. The
# runner's apt lists go stale within days, so every install updates first.
# A push builds every core (inputs.core is empty), a dispatch the one picked.
jobs:
  beetle-psx:
    name: Beetle PSX
    if: ${{ !inputs.core || inputs.core == 'all' || inputs.core == 'beetle-psx' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: oxyromon
      - uses: actions/checkout@v7
        with:
          repository: alucryd/beetle-psx-libretro
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            oxyromon
            oxyromon/crates/smelt-rs
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev
      # Builds libsmelt and orers, then checks an ORE against its CUE
      - name: ORE test
        run: sh core/tools/ore/run.sh
      # Software, then HW: one object tree, so cleaned between them
      - name: Build cores
        run: |
          make -C core -j"$(nproc)" HAVE_ORE=1 SMELT_DIR="$SMELT_DIR"
          make -C core clean HAVE_HW=1
          make -C core -j"$(nproc)" HAVE_ORE=1 HAVE_HW=1 SMELT_DIR="$SMELT_DIR"
      - uses: actions/upload-artifact@v7
        with:
          name: mednafen_psx_libretro-ore-linux-x86_64
          path: |
            core/mednafen_psx_libretro.so
            core/mednafen_psx_hw_libretro.so
          if-no-files-found: error

  parallel-ps2:
    name: ParaLLEl PS2
    if: ${{ !inputs.core || inputs.core == 'all' || inputs.core == 'parallel-ps2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: oxyromon
      - uses: actions/checkout@v7
        with:
          repository: alucryd/parallel-ps2
          ref: ${{ env.CORE_REF }}
          path: core
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            oxyromon
            oxyromon/crates/smelt-rs
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xorriso liblzma-dev zlib1g-dev libgl-dev glslc
      # Builds libsmelt and orers, then checks OREs of a DVD and a CD
      # against their sources, under AddressSanitizer and UBSan
      - name: ORE test
        env:
          SANITIZER: address,undefined
        run: sh core/tests/ore/build.sh
      - name: Build core
        run: make -C core -j"$(nproc)" HAVE_ORE=1 SMELT_DIR="$SMELT_DIR"
      - uses: actions/upload-artifact@v7
        with:
          name: pcsx2_libretro-ore-linux-x86_64
          path: core/*_libretro.so

  pcee2:
    name: PCEE2
    if: ${{ !inputs.core || inputs.core == 'all' || inputs.core == 'pcee2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: oxyromon
      - uses: actions/checkout@v7
        with:
          repository: alucryd/pcee2-libretro
          ref: ${{ env.CORE_REF }}
          path: core
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oxyromon/crates/smelt-rs
      # As pcee2's own Linux build installs them
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang liblz4-dev libwebp-dev \
            libshaderc-dev libcurl4-openssl-dev libpcap-dev libfontconfig-dev \
            libudev-dev libx11-dev libxrandr-dev libxext-dev extra-cmake-modules \
            libwayland-dev libegl-dev libdbus-1-dev libfreetype-dev libjpeg-turbo8-dev \
            libpng-dev zlib1g-dev libzstd-dev libdrm-dev libxkbcommon-dev libpipewire-0.3-dev \
            libpulse-dev libasound2-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxfixes-dev libxrender-dev \
            libxss-dev libxtst-dev libgl1-mesa-dev libdecor-0-dev libgbm-dev
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: deps
          key: pcee2-linux-libretro-static-deps ${{ hashFiles('core/pcee2-libretro/scripts/build-deps-linux.sh', 'core/pcee2-libretro/scripts/deps.versions') }}
      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          PCEE2_SDL_STATIC: "1"
          PCEE2_BUILD_JPEG: "1"
        run: bash core/pcee2-libretro/scripts/build-deps-linux.sh "$PWD/deps"
      - name: Build libsmelt
        run: cargo build --release --manifest-path "$SMELT_DIR/Cargo.toml"
      - name: Build core
        run: |
          cmake -S core -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF -DENABLE_LIBRETRO=ON \
            -DCMAKE_PREFIX_PATH="$PWD/deps" \
            -DSHADERC_STATIC=ON \
            "-DSHADERC_LIBRARY=$PWD/deps/lib/libshaderc_combined.a" \
            -DDISABLE_ADVANCE_SIMD=ON \
            -DORE=ON -DSMELT_DIR="$SMELT_DIR"
          cmake --build build --target pcee2_libretro
      # No test suite in the core: at least the reader is in it
      - name: Check the ORE reader is linked
        run: nm -C build/bin/pcee2_libretro.so | grep -q OreFileReader::Open2
      - uses: actions/upload-artifact@v7
        with:
          name: pcee2_libretro-ore-linux-x86_64
          path: build/bin/pcee2_libretro.so

  dolphin:
    name: Dolphin
    if: ${{ !inputs.core || inputs.core == 'all' || inputs.core == 'dolphin' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          path: oxyromon
      - uses: actions/checkout@v7
        with:
          repository: alucryd/dolphin
          ref: ${{ env.CORE_REF }}
          path: core
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oxyromon/crates/smelt-rs
      # As Dolphin's own libretro Ubuntu build installs them
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev \
            libx11-dev libxi-dev libxrandr-dev libudev-dev libevdev-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libmbedtls-dev libcurl4-openssl-dev zlib1g-dev
      - name: Build libsmelt
        run: cargo build --release --manifest-path "$SMELT_DIR/Cargo.toml"
      - name: Build core
        run: |
          cmake -S core -B build -G Ninja \
            -DLIBRETRO=ON -DCMAKE_BUILD_TYPE=Release \
            -DORE=ON -DSMELT_DIR="$SMELT_DIR"
          cmake --build build
      # No test suite in the libretro build: at least the reader is in it
      - name: Check the ORE reader is linked
        run: nm -C "$(find build -name dolphin_libretro.so | head -1)" | grep -q OREFileReader::Read
      - uses: actions/upload-artifact@v7
        with:
          name: dolphin_libretro-ore-linux-x86_64
          path: build/**/dolphin_libretro.so

  mesen:
    name: Mesen
    runs-on: ubuntu-24.04
    if: ${{ !inputs.core || inputs.core == 'all' || inputs.core == 'mesen' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: oxyromon
      - uses: actions/checkout@v7
        with:
          repository: alucryd/Mesen
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oxyromon/crates/smelt-rs
      - name: Build libsmelt
        run: cargo build --release --manifest-path "$SMELT_DIR/Cargo.toml"
      - name: Build core
        run: make -C core/Libretro -j"$(nproc)" ORE=1 SMELT_DIR="$SMELT_DIR"
      # No test suite in the core: at least the reader is in it
      - name: Check the ORE reader is linked
        run: nm core/Libretro/mesen_libretro.so | grep -q smelt_open
      - uses: actions/upload-artifact@v7
        with:
          name: mesen_libretro-ore-linux-x86_64
          path: core/Libretro/mesen_libretro.so

  mesen-s:
    name: Mesen-S
    runs-on: ubuntu-24.04
    if: ${{ !inputs.core || inputs.core == 'all' || inputs.core == 'mesen-s' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: oxyromon
      - uses: actions/checkout@v7
        with:
          repository: alucryd/Mesen-S
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oxyromon/crates/smelt-rs
      - name: Build libsmelt
        run: cargo build --release --manifest-path "$SMELT_DIR/Cargo.toml"
      - name: Build core
        run: make -C core/Libretro -j"$(nproc)" ORE=1 SMELT_DIR="$SMELT_DIR"
      # No test suite in the core: at least the reader is in it
      - name: Check the ORE reader is linked
        run: nm core/Libretro/mesen-s_libretro.so | grep -q smelt_open
      - uses: actions/upload-artifact@v7
        with:
          name: mesen-s_libretro-ore-linux-x86_64
          path: core/Libretro/mesen-s_libretro.so

  sameboy:
    name: SameBoy
    runs-on: ubuntu-24.04
    if: ${{ !inputs.core || inputs.core == 'all' || inputs.core == 'sameboy' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: oxyromon
      - uses: actions/checkout@v7
        with:
          repository: alucryd/SameBoy
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oxyromon/crates/smelt-rs
      - name: Build libsmelt
        run: cargo build --release --manifest-path "$SMELT_DIR/Cargo.toml"
      - name: Build core
        run: make -C core/libretro -j"$(nproc)" ORE=1 SMELT_DIR="$SMELT_DIR"
      # No test suite in the core: at least the reader is in it
      - name: Check the ORE reader is linked
        run: nm core/libretro/sameboy_libretro.so | grep -q smelt_open
      - uses: actions/upload-artifact@v7
        with:
          name: sameboy_libretro-ore-linux-x86_64
          path: core/libretro/sameboy_libretro.so

  mgba:
    name: mGBA
    runs-on: ubuntu-24.04
    if: ${{ !inputs.core || inputs.core == 'all' || inputs.core == 'mgba' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: oxyromon
      - uses: actions/checkout@v7
        with:
          repository: alucryd/mgba
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oxyromon/crates/smelt-rs
      - name: Build libsmelt
        run: cargo build --release --manifest-path "$SMELT_DIR/Cargo.toml"
      # As mGBA's own libretro builds configure it
      - name: Build core
        run: |
          cmake -S core -B build \
            -DCMAKE_BUILD_TYPE=Release -DLIBMGBA_ONLY=ON -DBUILD_LIBRETRO=ON \
            -DORE=ON -DSMELT_DIR="$SMELT_DIR"
          cmake --build build --target mgba_libretro -j"$(nproc)"
      # No test suite in the libretro build: at least the reader is in it
      - name: Check the ORE reader is linked
        run: nm build/mgba_libretro.so | grep -q smelt_open
      - uses: actions/upload-artifact@v7
        with:
          name: mgba_libretro-ore-linux-x86_64
          path: build/mgba_libretro.so
