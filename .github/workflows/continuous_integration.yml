name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # The web UI (Leptos + Trunk) is built once by the "Build web UI" step below;
  # all cargo invocations reuse those assets instead of rebuilding the wasm.
  SKIP_TRUNK: "true"
  TRUNK_VERSION: "0.21.14"

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies
        # The runner image ships apt lists baked at image-build time, which go stale
        # within days. Ubuntu rolls superseded .debs out of the pool when a newer
        # point version lands, so installing against the cached lists 404s.
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install bchunk dolphin-emu liblz4-1 libuv1 libzopfli1 mame-tools wit xdelta3
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: clippy, llvm-tools-preview
      - name: Use the installed toolchain
        run: rustup default stable
      - name: Configure rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf- -C "$HOME/.cargo/bin"
      - name: Build web UI
        run: cd frontend && trunk build --release
      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Run clippy
        run: cargo clippy --features server
      - name: Build
        run: cargo build --release --features server
      - name: Test
        run: cargo llvm-cov --features server --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
