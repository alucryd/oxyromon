name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CARGO_TERM_COLOR: always
  # The web UI (Leptos + Trunk) is built once, by the web-ui job; no cargo
  # invocation rebuilds the wasm. Without its assets, build.rs leaves
  # target/assets empty, which is all clippy and the tests need.
  SKIP_TRUNK: "true"
  TRUNK_VERSION: "0.21.14"
  # The nextest release the test step installs; pinned like trunk, so an
  # upstream release cannot change CI's behaviour without a commit here.
  NEXTEST_VERSION: "0.9.152"

# The runner image ships apt lists baked at image-build time, which go stale
# within days. Ubuntu rolls superseded .debs out of the pool when a newer point
# version lands, so installing against the cached lists 404s: every job that
# installs packages runs `apt-get update` first.

jobs:
  format:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      # frontend/, desktop/ and crates/smelt-rs/ are workspaces of their own,
      # so the root's `--all` does not reach them.
      - name: Check formatting
        run: |
          cargo fmt --all --check
          (cd frontend && cargo fmt --check)
          (cd desktop && cargo fmt --check)
          (cd crates/smelt-rs && cargo fmt --check)

  web-ui:
    name: Web UI
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: clippy
      - name: Use the installed toolchain
        run: rustup default stable
      - name: Configure rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend
      - name: Install Trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf- -C "$HOME/.cargo/bin"
      - name: Build web UI
        run: cd frontend && trunk build --release
      # The web UI is its own workspace, built for the browser.
      - name: Run clippy
        run: cd frontend && cargo clippy --target wasm32-unknown-unknown --all-targets
      - name: Upload web UI
        uses: actions/upload-artifact@v7
        with:
          name: web-ui
          path: target/assets
          if-no-files-found: error
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Use the installed toolchain
        run: rustup default stable
      - name: Configure rust cache
        uses: Swatinem/rust-cache@v2
      # The whole workspace: oxyromon and the format crates under crates/. A
      # feature has to name its package once several are selected.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features oxyromon/server
      # The MCP stdio server also ships without the web server; exercise that
      # feature combination on its own.
      - name: Run clippy (MCP without server)
        run: cargo clippy --no-default-features --features use-rustls,mcp --all-targets

  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Use the installed toolchain
        run: rustup default stable
      - name: Configure rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov
      # nextest runs each test binary's tests in parallel and reports time
      # per test; the suites add up no more, the slowest one does.
      - name: Install nextest
        run: curl -LsSf https://get.nexte.st/${{ env.NEXTEST_VERSION }}/linux | tar zxf - -C "$CARGO_HOME/bin"
      # chd-rs and xdelta-rs compare against chdman, xdelta3 and ffmpeg and
      # skip themselves without them; the interop workflow installs them and
      # runs those tests where they count.
      - name: Test
        run: cargo llvm-cov nextest --workspace --features oxyromon/server --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}

  smelt:
    name: Smelt
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Use the installed toolchain
        run: rustup default stable
      - name: Configure rust cache
        uses: Swatinem/rust-cache@v2
      # smelt, a workspace of its own so ore-rs's GPL writer stays out of
      # libsmelt; cbindgen for its test that smelt.h is current
      - name: Install cbindgen
        run: cargo install cbindgen --locked
      - name: Run clippy (smelt)
        run: cargo clippy --manifest-path crates/smelt-rs/Cargo.toml --all-targets
      - name: Test smelt
        run: cargo test --manifest-path crates/smelt-rs/Cargo.toml

  release:
    name: Release build and desktop
    needs: web-ui
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies
        # the desktop shell's Tauri webview
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install libwebkit2gtk-4.1-dev libxdo-dev
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Use the installed toolchain
        run: rustup default stable
      - name: Configure rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - name: Download web UI
        uses: actions/download-artifact@v8
        with:
          name: web-ui
          path: target/assets
      # The release binary, with the web UI embedded, staged as the desktop
      # shell's sidecar: tauri-build refuses to compile without it.
      - name: Build
        run: sh desktop/scripts/stage-sidecar.sh
      # The desktop shell is its own workspace.
      - name: Run clippy (desktop)
        run: cd desktop && cargo clippy --all-targets
