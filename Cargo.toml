[package]
authors = ["Maxime Gauduin <alucryd@archlinux.org>"]
categories = ["command-line-utilities", "games"]
description = "Rusty ROM OrgaNizer"
edition = "2024"
exclude = [".github/", "crates/", "dist/", "tests/"]
homepage = "https://github.com/alucryd/oxyromon"
keywords = ["cli", "rom", "tool"]
license = "GPL-3.0+"
name = "oxyromon"
readme = "README.md"
repository = "https://github.com/alucryd/oxyromon"
version = "0.25.0"
rust-version = "1.94.0"

# The format crates: standalone libraries and CLIs ported from the external
# tools oxyromon used to shell out to. They share one lockfile, CI and set of
# conventions, documented in CLAUDE.md, but are published independently.
[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94.0"
repository = "https://github.com/alucryd/oxyromon"

[workspace.dependencies]
clap = "4.6.6"
console = "0.16.6"
crc32fast = "1.5.2"
indicatif = "0.18.6"
rayon = "1.12.0"
tempfile = "3.27.0"
thiserror = "2"

[features]
default = ["use-rustls"]
use-native-tls = ["reqwest/native-tls"]
use-rustls = ["reqwest/rustls"]
server = ["async-graphql", "async-graphql-axum", "axum", "http-types", "percent-encoding", "tower-http"]

[dependencies]
anyhow = "1.0.104"
async-graphql = { version = "7.2.1", features = [
    "dataloader",
], default-features = false, optional = true }
async-graphql-axum = { version = "7.2.1", optional = true }
async-stream = "0.3.6"
axum = { version = "0.8.9", default-features = false, features = [
    "http2",
    "multipart",
    "tokio",
    "ws",
], optional = true }
cfg-if = "1.0.4"
console.workspace = true
chrono = { version = "0.4.45", default-features = false, features = [
    "std",
    "alloc",
    "now",
    "clock",
] }
clap.workspace = true
crc32fast.workspace = true
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
digest = "0.11.3"
digest-io = "0.1.0"
dirs = "7.0.0"
dotenvy = "0.15.7"
env_logger = "0.11.11"
flate2 = "1.1.10"
futures = "0.3.34"
gdi-rs = { path = "crates/gdi-rs", version = "0.1.0", default-features = false }
http-types = { version = "2.12.0", optional = true }
indexmap = { version = "2.14.2", default-features = false, features = [
    "std",
    "rayon",
] }
indicatif.workspace = true
indicatif-log-bridge = "0.2.3"
infer = "0.22.0"
itertools = "0.15.0"
log = "0.4.34"
md-5 = "0.11.0"
# ponytail: git tag until nod publishes past 2.0.0-alpha.9 to crates.io, which
# blocks publishing oxyromon; back to a version requirement before a release.
nod = { git = "https://github.com/encounter/nod", tag = "v2.0.0-alpha.12" }
nsz-rs = { path = "crates/nsz-rs", version = "0.3.0", default-features = false }
xdelta-rs = { path = "crates/xdelta-rs", version = "0.1.0", default-features = false }
xps-rs = { path = "crates/xps-rs", version = "0.1.0", default-features = false }
num-derive = "0.5.1"
num-traits = "0.2.19"
percent-encoding = { version = "2.3.2", optional = true }
phf = { version = "0.14.0", features = ["macros"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
rayon.workspace = true
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
rust-embed = { version = "8.12.0", features = ["compression"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
shiratsu-naming = "1.1.0"
# ponytail: the fork's branch until upstream releases `push_raw_block`, which
# blocks publishing oxyromon; back to a version requirement before a release.
sevenz-rust2 = { git = "https://github.com/alucryd/sevenz-rust2", branch = "feat/raw-copy", features = ["zstd"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
] }
strsim = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
tempfile.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1.53.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
] }
tower-http = { version = "0.7.1", features = ["cors"], optional = true, default-features = false }
vec-drain-where = "1.0.1"
walkdir = "2.5.0"
xso-rs = { path = "crates/xso-rs", version = "0.1.0", default-features = false }
zip = { version = "8.6.0", features = [
    "deflate",
    "zstd",
], default-features = false }

[dev-dependencies]
wiremock = "0.6.5"

[[bin]]
name = "oxyromon"
path = "src/main.rs"

# Compression and hashing live in dependencies, and at opt-level 0 the pure Rust
# codecs run roughly an order of magnitude slower than their release selves. That
# makes debug builds miserable to use and benchmarks taken from them meaningless.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
